# Save settings changed at runtime (Studio lighting, sleep and trackball
# settings, BT profile changes) about a second after the last change instead
# of ZMK's 60 s default, so a change made just before a reboot or unplug is
# not lost. The settings NVS partition rotates writes across 8 sectors of
# ~10,000 erase cycles each, so flash wear stays negligible, and 1 s still
# merges a burst of slider updates into one write.
#
# This must be a .conf assignment: app/Kconfig defines this symbol with an
# unconditional "default 60000" before shield Kconfig.defconfig files are
# sourced, and Kconfig uses the first default, so a defconfig default is
# silently ignored.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=1000

# Zephyr's default input thread stack is 512 bytes (ZMK raises it to 1024 only
# on split peripherals). On the half that reports to the host, every trackball
# event from both halves runs through this thread: split input forwarding, the
# input listener, input processors (scalers, auto-mouse layer with its movement
# threshold) and the mouse HID report path. 2048 bytes leaves headroom for that
# call chain; all halves use the same value so their configs stay consistent.
CONFIG_INPUT_THREAD_STACK_SIZE=2048
