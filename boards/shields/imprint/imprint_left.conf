# wiki#44: enlarge the ZMK Studio RPC transport ring buffers.
#
# The upstream ZMK defaults are RX=30 / TX=64 bytes (app/src/studio/Kconfig).
# Those are too small for the pointing-device-subsystem's config traffic: when
# Studio loads/changes a trackball config panel it pipelines several requests
# (get_input_processor_config, get_device_config, SetDeviceConfig with a full
# config payload). While the low-priority studio_rpc_thread is busy decoding /
# responding to one request, the UART ISR keeps filling the 30-byte RX ring
# with the next request's bytes; the ring overflows, a byte is dropped
# ("Dropping incoming RPC byte, insufficient room in the RX buffer"), the RPC
# framing desyncs, and the connection wedges permanently on "loading
# configuration". The enumeration response also overflowed the 64-byte TX ring
# ("no room to write escape and real byte"). RAM cost of the bump is ~900 B.
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=512

# Consumer (media-key) reports: use the basic single-byte usage range. The
# full two-byte range has compatibility problems on some host OSes (notably
# macOS media keys).
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# Send GATT notifications even before the host has re-subscribed to the
# characteristic. Works around Windows hosts that stop receiving battery-level
# notifications after reconnect.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Let an already-bonded host re-pair without deleting the old bond first, so
# "remove the device and pair again" works from the host side alone. Trade-off:
# a device spoofing the host's address could replace the bond (it still cannot
# read an existing encrypted link).
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
# ZMK implies passkey entry when unauth overwrite is on; keep today's
# "Just Works" pairing (no code typed on the keyboard).
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
