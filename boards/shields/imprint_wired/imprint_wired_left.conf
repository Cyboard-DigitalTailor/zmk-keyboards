# RGB underglow is stubbed for the spike. ZMK_RGB_UNDERGLOW defaults y
# module-wide (the imprint shield's Kconfig.defconfig), and rgb_underglow.c
# will not compile without a zmk,underglow strip — which on RP2040 is a
# ws2812 PIO node, deferred to its own phase. Turn it off explicitly here.
CONFIG_ZMK_RGB_UNDERGLOW=n

# Enlarge the ZMK Studio RPC transport ring buffers, same reason as the
# wireless imprint_left.conf: the stock RX=30/TX=64 overflow under the
# pointing-config traffic and wedge the connection. RAM cost ~900 B.
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=512
