manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: Cyboard-DigitalTailor
      url-base: https://github.com/Cyboard-DigitalTailor
  projects:
    - name: zmk
      remote: zmkfirmware
      # Pinned to the latest stable ZMK release (matches the 0.3.0-based
      # Studio firmware stack). For current ZMK main / Zephyr 4.1, use the
      # zephyr-4.1 branch of this repo instead.
      revision: v0.3.0
      import: app/west.yml
    - name: zmk-pmw3610-driver
      remote: Cyboard-DigitalTailor
      # Pinned to a tagged release so a zmk-keyboards snapshot freezes its whole
      # module chain: a later change on the driver's startup_optimization branch
      # cannot shift trackball behavior under a config pinned to a zmk-keyboards
      # tag. Bump this deliberately alongside the zmk-keyboards release tag. To
      # track the moving branch instead, set this to startup_optimization.
      revision: v2026.07
  self:
    path: config
